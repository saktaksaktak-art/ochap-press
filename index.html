<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お茶P新聞</title><style>body{font:14px/1.7 system-ui,sans-serif;background:#faf8f0;color:#203e36;padding:22px}#ochap-loading{max-width:680px;margin:20px auto}</style></head>
<body><p id="ochap-loading">お茶P新聞を読み込んでいます。</p>
<script>
(async function(){
  'use strict';
  const showError=(message)=>{document.getElementById('ochap-loading').textContent='新聞を表示できません：'+message};
  try {
    const listResponse=await fetch('./data/issue-index.json',{cache:'no-store'});
    if(!listResponse.ok)throw new Error('日付一覧の取得に失敗しました');
    const manifest=await listResponse.json();
    if(!manifest || !Array.isArray(manifest.issues) || !manifest.issues.length)throw new Error('日付一覧が不正です');
    const query=new URL(location.href).searchParams.get('date');
    const date=manifest.issues.some(x=>x.date===query)?query:manifest.default_date;
    const issue=manifest.issues.find(x=>x.date===date);
    if(!issue || !/^[a-zA-Z0-9._/-]+$/.test(issue.path) || issue.path.startsWith('/'))throw new Error('選択日の新聞が見つかりません');
    const result=await fetch('./'+issue.path,{cache:'no-store'});
    if(!result.ok)throw new Error('新聞HTMLを取得できません（HTTP '+result.status+'）');
    let source;
    if(issue.compression==='base64gzip'){
      const ascii=(await result.text()).trim();
      if(!/^[A-Za-z0-9+/=]+$/.test(ascii))throw new Error('過去号の圧縮データが不正です');
      const raw=atob(ascii);
      const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
      if(!('DecompressionStream' in window))throw new Error('このブラウザは過去号の解凍に対応していません');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      source=await new Response(stream).text();
    }else if(issue.compression==='gzip'){
      const bytes=new Uint8Array(await result.arrayBuffer());
      if(bytes[0]===0x1f && bytes[1]===0x8b){
        if(!('DecompressionStream' in window))throw new Error('このブラウザは過去号の解凍に対応していません');
        source=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      }else{source=new TextDecoder().decode(bytes)}
    }else{source=await result.text()}
    if(!/<head[\s>]/i.test(source)||!/<\/head>/i.test(source)||!/<\/body>/i.test(source))throw new Error('新聞原本のHTMLが不正です');
    const headTags='<link rel="stylesheet" href="./assets/date-nav.css">'+
      '<link rel="stylesheet" href="./assets/press-roles.css?v=1">'+
      (issue.gemi_tabs?'<link rel="stylesheet" href="./assets/gemi-reporter.css?v=20261101-attribution-fix">':'');
    const encoded=JSON.stringify(manifest).replace(/</g,'\\u003c');
    const setGlobals='<script>window.__OCHAP_ISSUE_INDEX__='+encoded+';window.__OCHAP_SELECTED_DATE__='+JSON.stringify(date)+';</'+'script>';
    const extraScripts=setGlobals+'<script src="./assets/date-nav.js"></'+'script>'+ (issue.gemi_tabs?'<script src="./assets/gemi-reporter.js?v=20261101-attribution-fix"></'+'script>':'')+
      '<script src="./assets/press-roles.js?v=3"></'+'script>';
    source=source.replace(/<\/head>/i,headTags+'</head>');
    source=source.replace(/<\/body>/i,extraScripts+'</body>');
    document.open();document.write(source);document.close();
  }catch(err){showError(err.message||String(err));}
})();
</script>
</body></html>
