<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お茶P新聞</title>
  <style>body{font-family:system-ui,sans-serif;background:#eeeade;color:#21372e;margin:0;padding:25px}p{max-width:680px;margin:auto}</style>
</head>
<body>
  <p id="loading">お茶P新聞を読み込んでいます。</p>
  <script>
  (async function(){
    try{
      const response=await fetch('./ochap-original.html',{cache:'no-store'});
      if(!response.ok)throw new Error('新聞本体の取得に失敗しました（HTTP '+response.status+'）');
      const source=await response.text();
      if(!source.includes('</head>') || !source.includes('<article '))throw new Error('新聞HTMLの形式を確認できません');
      const css='<link rel="stylesheet" href="./assets/gemi-reporter.css">';
      const js='<scr'+'ipt src="./assets/gemi-reporter.js"></scr'+'ipt>';
      const html=source.replace('</head>',css+'</head>').replace('</body>',js+'</body>');
      document.open();document.write(html);document.close();
    }catch(err){
      document.getElementById('loading').textContent='新聞を表示できません。'+err.message;
    }
  })();
  </script>
</body>
</html>
