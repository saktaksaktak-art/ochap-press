<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お茶P新聞</title><style>body{font:14px/1.7 system-ui,sans-serif;background:#faf8f0;color:#203e36;padding:22px}#ochap-loading{max-width:680px;margin:20px auto}</style></head>
<body><p id="ochap-loading">お茶P新聞を読み込んでいます。</p>
<script>
(async function(){
  'use strict';
  const showError=(message)=>{document.getElementById('ochap-loading').textContent='新聞を表示できません：'+message};
  try {
    const listResponse=await fetch('./data/issue-index.json',{cache:'no-store'});
    if(!listResponse.ok)throw new Error('日付一覧の取得に失敗しました');
    const manifest=await listResponse.json();
    if(!manifest || !Array.isArray(manifest.issues) || !manifest.issues.length)throw new Error('日付一覧が不正です');
    const query=new URL(location.href).searchParams.get('date');
    const date=manifest.issues.some(x=>x.date===query)?query:manifest.default_date;
    const issue=manifest.issues.find(x=>x.date===date);
    const issuePath=issue?.reader_path||issue?.path;
    if(!issuePath || !/^[a-zA-Z0-9._/-]+$/.test(issuePath) || issuePath.startsWith('/') || issuePath.split('/').includes('..'))throw new Error('選択日の新聞が見つかりません');
    const result=await fetch('./'+issuePath,{cache:'no-store'});
    if(!result.ok)throw new Error('新聞HTMLを取得できません（HTTP '+result.status+'）');
    let source;
    if(issue.compression==='base64gzip'){
      const ascii=(await result.text()).trim();
      if(!/^[A-Za-z0-9+/=]+$/.test(ascii))throw new Error('過去号の圧縮データが不正です');
      const raw=atob(ascii);
      const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
      if(!('DecompressionStream' in window))throw new Error('このブラウザは過去号の解凍に対応していません');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      source=await new Response(stream).text();
    }else if(issue.compression==='gzip'){
      const bytes=new Uint8Array(await result.arrayBuffer());
      if(bytes[0]===0x1f && bytes[1]===0x8b){
        if(!('DecompressionStream' in window))throw new Error('このブラウザは過去号の解凍に対応していません');
        source=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      }else{source=new TextDecoder().decode(bytes)}
    }else{source=await result.text()}
    if(!/<head[\s>]/i.test(source)||!/<\/head>/i.test(source)||!/<\/body>/i.test(source))throw new Error('新聞原本のHTMLが不正です');
    // Bind the shared number matcher to each archived filter without rewriting the archive.
    // The legacy name/text predicates and their pagination, venue and race filters stay in place.
    const matcher='window.OchaPRegistrationSearch?.match';
    const searchPredicates=[
      ['a.textContent.includes(q.value)','a','q.value'],
      ["document.getElementById(tr.querySelector('a').hash.slice(1)).textContent.includes(q.value)","document.getElementById(tr.querySelector('a').hash.slice(1))",'q.value'],
      ['art.dataset.search.toLowerCase().includes(q)','art','q'],
      ["a.dataset.search.replaceAll(' ','').toLowerCase().includes(query)",'a','q.value'],
      ["r.dataset.search.replaceAll(' ','').includes(q.value.replaceAll(' ',''))",'r','q.value'],
      ['tokens.every(function (token) { return haystack.indexOf(token) !== -1; })','card','search.value'],
      ['txt.includes(qVal)','c','qVal']
    ];
    source=source.replace(/(<script\b[^>]*>)([\s\S]*?)(<\/script>)/gi,(block,open,code,close)=>{
      if(/\b(?:src|type)\s*=/.test(open)||!code.includes(".includes(")&&!code.includes("tokens.every("))return block;
      for(const [predicate,race,value] of searchPredicates){
        if(code.includes(predicate))code=code.replaceAll(predicate,'('+matcher+'('+race+','+value+',()=>'+predicate+')??'+predicate+')');
      }
      return open+code+close;
    });
    // Historical newspaper HTML can bundle its own Gemini reporter assets.
    // Inject only assets missing from the source; otherwise tabs initialize twice.
    const cleanGemi = date >= '2026-11-16';
    if(cleanGemi && issue.gemi_tabs)source=source.replace(/<script\b[^>]*\bsrc\s*=\s*["'][^"']*gemi-reporter\.js(?:\?[^"']*)?["'][^>]*>\s*<\/script>/gi,'');
    const bundledGemiScript=/<script\b[^>]*\bsrc\s*=\s*["'][^"']*gemi-reporter\.js(?:\?[^"']*)?["']/i.test(source);
    const bundledGemiStyle=/<link\b[^>]*\bhref\s*=\s*["'][^"']*gemi-reporter\.css(?:\?[^"']*)?["']/i.test(source);
    const gemiScript = !cleanGemi && /^assets\/(?:\d{8}\/)?gemi-reporter\.js$/.test(issue.gemi_script || '')
      ? issue.gemi_script : 'assets/gemi-reporter.js';
    const headTags='<link rel="stylesheet" href="./assets/date-nav.css">'+
      '<link rel="stylesheet" href="./assets/press-roles.css?v=5">'+
      '<link rel="stylesheet" href="./assets/live-results.css?v=3">'+
      '<link rel="stylesheet" href="./assets/special-races.css?v=1">'+
      '<link rel="stylesheet" href="./assets/ticket-colors.css?v=1">'+
      '<link rel="stylesheet" href="./assets/public-scorecard.css?v=2">'+
      (issue.gemi_tabs&&!bundledGemiStyle?'<link rel="stylesheet" href="./assets/gemi-reporter.css?v=20261101-floating-v2">':'')+
      '<link rel="stylesheet" href="./assets/navy-reader.css?v=2">'+
      '<link rel="stylesheet" href="./assets/compact-reader.css?v=1">'+
      '<link rel="stylesheet" href="./assets/favorite-venues.css?v=1">'+
      '<style id="ochap-reader-grid">html body table :is(th,td){border:1px solid #8fa3bd!important}</style>'+
      '<link rel="stylesheet" href="./assets/reader-table-layout.css?v=3">'+
      '<script src="./assets/reader-registration-search.js?v=1"></'+'script>';
    const extraScripts='<script src="./assets/date-nav.js"></'+'script>'+ (issue.gemi_tabs&&!bundledGemiScript?'<script src="./'+gemiScript+(cleanGemi?'?v=20261116-editorial-clean':'?v=20261105-tables-v2')+'"></'+'script>':'')+
      '<script src="./assets/public-scorecard.js?v=6"></'+'script>'+
      '<script src="./assets/hit-reporters.js?v=10"></'+'script>'+
      '<script src="./assets/live-results.js?v=5"></'+'script>'+
      '<script src="./assets/consensus.js?v=7"></'+'script>'+
      '<script src="./assets/special-races.js?v=2"></'+'script>'+
      '<script src="./assets/favorite-venues.js?v=1"></'+'script>'+
      '<script src="./assets/press-roles.js?v=17"></'+'script>'+
      '<script src="./assets/ticket-colors.js?v=1"></'+'script>'+
      '<script src="./assets/compact-reader.js?v=1"></'+'script>'+
      '<script src="./assets/reader-jump.js?v=4"></'+'script>'+
      '<script src="./assets/reader-course-copy.js?v=2"></'+'script>'+
      '<script src="./assets/reader-table-layout.js?v=3"></'+'script>'+
      (date>='2026-11-16'?'<script src="./assets/reader-st-supplement.js?v=1"></'+'script>':'')+
      (date>='2026-11-16'?'<script type="module" src="./assets/reader-course-baseline.mjs?v=2"></'+'script>':'');
    source=source.replace(/<\/head>/i,headTags+'</head>');
    source=source.replace(/<\/body>/i,extraScripts+'</'+'body>');
    // Keep publication evidence in its JSON response and runtime state, never in a DOM script element.
    document.open();
    window.__OCHAP_ISSUE_INDEX__=manifest;
    window.__OCHAP_SELECTED_DATE__=date;
    document.write(source);document.close();
  }catch(err){showError(err.message||String(err));}
})();
</script>
</body></html>
