name: Check reporter attribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reporter-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ranked and legacy published forecast ticket loading
        run: |
          bash scripts/check_press_ui_lock.sh
          node scripts/test_ticket_loading.js
          node scripts/test_hit_reporters.js
          node scripts/test_consensus_categories.js
          node scripts/test_special_races.js
          python3 scripts/check_published_ticket_loading.py
          python3 scripts/check_public_editorial.py
          node --test tests/test_reader_methods.mjs
      - name: Check Gemini frontend JavaScript syntax
        run: node --check assets/gemi-reporter.js
      - name: Check reporter attribution and shared-table headings
        run: python3 scripts/check_reporter_attribution.py
      - name: Check Gemini forecast publication linkage
        run: |
          python3 scripts/check_gemi_publication.py
          node --check assets/20261105/gemi-reporter.js
      - name: Validate public reader scorecard data
        run: |
          node --check assets/press-roles.js
          python3 scripts/check_public_scorecard.py
          node scripts/test_course_hit_rates.js
      - name: Validate restored historical results and journalist scorecards
        run: |
          node --check assets/public-scorecard.js
          node scripts/test_public_scorecard.js
      - name: Check Python publication validator syntax
        run: python3 -m py_compile scripts/validate_gemi_press_issue.py


      - name: Verify result acquisition, merge, recovery and scheduler offline
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          python -m py_compile scripts/results_flash.py scripts/publish_public_results.py scripts/reconcile_public_results.py
          python -m unittest discover -s tests -p 'test_public_results*.py' -v
          node scripts/test_results_flash_dispatcher.js

      - name: Verify the 390px newspaper layout in Chrome
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'fix/special-races') || startsWith(github.head_ref, 'feat/navy-newspaper') || startsWith(github.head_ref, 'fix/reader-race-source-details') || startsWith(github.head_ref, 'feat/compact-reader') || startsWith(github.head_ref, 'fix/reader-course-copy') || startsWith(github.head_ref, 'fix/reader-registration-search') || startsWith(github.head_ref, 'feat/reader-favorite-venues') || startsWith(github.head_ref, 'feat/public-editorial-cleanup') || startsWith(github.head_ref, 'fix/results-section-order'))
        run: |
          python3 -m pip install --quiet playwright
          python3 scripts/check_special_browser.py

      - name: Verify table grids and 320px / 390px layout in Chrome
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet playwright
          python3 scripts/check_reader_table_browser.py
