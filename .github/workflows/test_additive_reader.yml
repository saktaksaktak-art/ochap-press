name: Verify additive deadline and M1 pages

on:
  pull_request:
    paths:
      - "assets/favorite-venues.js"
      - "assets/race-board.js"
      - "assets/race-board.css"
      - "deadline.html"
      - "m1.html"
      - "scripts/test_additive_deadline_browser.py"
      - ".github/workflows/test_additive_reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  additive-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the approved original newspaper lock and new JS syntax
        run: |
          bash scripts/check_press_ui_lock.sh
          node --check assets/favorite-venues.js
          node --check assets/race-board.js
      - name: Install browser test dependency
        run: python -m pip install --quiet playwright
      - name: Check additive deadline and M1 pages at mobile and desktop widths
        run: python scripts/test_additive_deadline_browser.py
      - name: Check original newspaper tabs and favorites are unchanged
        run: python scripts/check_special_browser.py
      - name: Check existing rich tables and 320px/390px layout
        run: python scripts/check_reader_table_browser.py
