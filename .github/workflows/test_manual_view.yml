name: Verify manual reader display modes

on:
  pull_request:
    paths:
      - "assets/view-mode.js"
      - "assets/view-mode.css"
      - "assets/date-nav.js"
      - "view-mode.html"
      - "deadline.html"
      - "m1.html"
      - "scripts/test_manual_view_browser.py"
      - ".github/workflows/test_manual_view.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source and syntax
        run: |
          bash scripts/check_press_ui_lock.sh
          node --check assets/date-nav.js
          node --check assets/view-mode.js
      - name: Install Playwright
        run: python -m pip install --quiet playwright
      - name: Test auto, smartphone, tablet and PC
        run: python scripts/test_manual_view_browser.py
      - name: Check unchanged newspaper browser behaviors
        run: python scripts/check_reader_table_browser.py
