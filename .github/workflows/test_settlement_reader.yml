name: Verify additive result and settlement controls

on:
  pull_request:
    paths:
      - "assets/forecast-settlement.js"
      - "assets/forecast-settlement.css"
      - "assets/date-nav.js"
      - "deadline.html"
      - "m1.html"
      - "scripts/test_settlement_browser.py"
      - ".github/workflows/test_settlement_reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original paper lock and JS syntax
        run: |
          bash scripts/check_press_ui_lock.sh
          node --check assets/forecast-settlement.js
          node --check assets/date-nav.js
      - name: Browser dependency
        run: python -m pip install --quiet playwright
      - name: Verify 3-ren payout and controls at phone and PC widths
        run: python scripts/test_settlement_browser.py
      - name: Existing reader and 320px table regression
        run: python scripts/check_reader_table_browser.py
      - name: Existing special and reporter switching regression
        run: python scripts/check_special_browser.py
