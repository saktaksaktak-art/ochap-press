name: Publish API race results for newspaper
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_public_results.py'
      - 'tests/test_public_results.py'
      - 'tests/test_public_results_merge.py'
      - 'scripts/reconcile_public_results.py'
      - '.github/workflows/publish_official_public_results.yml'
  schedule:
    # UTC 00:00-14:45 = JST 09:00-23:45, 15-minute ticks
    - cron: '*/15 0-14 * * *'
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Optional JST date YYYY-MM-DD; blank means current day'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: ochap-official-public-results
  cancel-in-progress: false
jobs:
  official-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout published newspaper
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and safety checks
        run: |
          python -m py_compile scripts/publish_public_results.py
          node --check assets/press-roles.js
          python -m unittest discover -s tests -p 'test_public_results*.py' -v
      - name: Fetch internally validated API race results (no official-page checks)
        env:
          TARGET_DATE: ${{ inputs.issue_date }}
        run: |
          if [ -z "$TARGET_DATE" ]; then
            python scripts/publish_public_results.py
          else
            python scripts/publish_public_results.py --date "$TARGET_DATE"
          fi
      - name: Commit referenced results JSON only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-results/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'NO_NEW_OFFICIAL_DATA_TO_PUBLISH'
            exit 0
          fi
          # Concurrent push updates may land between checkout and commit.
          # Preserve previous rows, fetch fresh main, and reconcile strictly.
          # Never silently overwrite a different official result.
          mkdir -p "$RUNNER_TEMP/ochap-results-proposed"
          mapfile -t changed < <(git diff --cached --name-only -- data/public-results/)
          for file in "${changed[@]}"; do
            cp "$file" "$RUNNER_TEMP/ochap-results-proposed/$(basename "$file")"
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for proposal in "$RUNNER_TEMP"/ochap-results-proposed/*.json; do
              name="$(basename "$proposal")"
              python scripts/reconcile_public_results.py \
                --current "data/public-results/$name" \
                --incoming "$proposal" \
                --output "data/public-results/$name"
            done
            git add data/public-results/*.json
            if git diff --cached --quiet; then
              echo 'ALREADY_PUBLISHED_BY_ANOTHER_RUN'
              exit 0
            fi
            git commit -m 'data(results): update API newspaper bulletin (not formal BC)'
            if git push origin HEAD:main; then
              echo 'CONCURRENT_SAFE_API_RESULTS_PUBLISHED'
              exit 0
            fi
            echo "Push raced with another update, retrying ($attempt/3)"
          done
          echo 'Unable to publish safely after three retries' >&2
          exit 1
