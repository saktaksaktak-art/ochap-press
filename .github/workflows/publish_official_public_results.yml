name: Publish API race results for newspaper
on:
  push:
    branches: [main]
    paths:
      - 'scripts/results_flash.py'
      - 'scripts/publish_public_results.py'
      - 'scripts/reconcile_public_results.py'
      - 'tests/test_public_results*.py'
      - '.github/workflows/publish_official_public_results.yml'
  # Retain existing cron until GAS dispatch + Actions/HTTP success is verified.
  # After handover, remove only these two schedule lines.
  schedule:
    - cron: '*/15 0-14 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JST YYYY-MM-DD; blank means current day'
        required: false
        type: string
      issue_date:
        description: 'Legacy alias for target_date'
        required: false
        type: string
      scheduled_slot_jst:
        description: 'Scheduled JST slot, distinct from actual start time'
        required: false
        type: string
      dispatched_at_jst:
        description: 'Actual dispatcher start time'
        required: false
        type: string
      trigger_source:
        description: 'gas_80slot_scheduler or manual_recovery'
        required: false
        default: 'manual_recovery'
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: ochap-official-public-results
  cancel-in-progress: false
jobs:
  official-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Avoid PAT push auto-build plus an explicit duplicate build.
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production parser, merge, recovery and scheduler
        run: |
          python -m py_compile scripts/results_flash.py scripts/publish_public_results.py scripts/reconcile_public_results.py
          python -m unittest discover -s tests -p 'test_public_results*.py' -v
          node scripts/test_results_flash_dispatcher.js
      - name: Acquire, save, publish and independently read back
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ inputs.target_date || inputs.issue_date }}
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot_jst }}
          DISPATCHED_AT: ${{ inputs.dispatched_at_jst }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          python scripts/results_flash.py \
            --date "$TARGET_DATE" \
            --scheduled-slot-jst "$SCHEDULED_SLOT" \
            --dispatched-at-jst "$DISPATCHED_AT" \
            --trigger-source "$TRIGGER_SOURCE"
      - name: Save internal four-stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-results-4stage-${{ github.run_id }}
          path: /tmp/public-results-4stage.json
          if-no-files-found: warn
          retention-days: 7
