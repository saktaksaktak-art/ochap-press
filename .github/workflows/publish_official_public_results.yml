name: Publish independently verified public race results
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_public_results.py'
      - 'tests/test_public_results.py'
      - '.github/workflows/publish_official_public_results.yml'
  schedule:
    # UTC 00:00-14:45 = JST 09:00-23:45, 15-minute ticks
    - cron: '*/15 0-14 * * *'
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Optional JST date YYYY-MM-DD; blank means current day'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: ochap-official-public-results
  cancel-in-progress: false
jobs:
  official-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout published newspaper
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4==4.12.3'
      - name: Syntax and safety checks
        run: |
          python -m py_compile scripts/publish_public_results.py
          node --check assets/press-roles.js
          python -m unittest discover -s tests -p 'test_public_results.py' -v
      - name: Fetch only officially matched race results
        env:
          TARGET_DATE: ${{ inputs.issue_date }}
        run: |
          if [ -z "$TARGET_DATE" ]; then
            python scripts/publish_public_results.py --max-official 14 --sleep 1.25
          else
            python scripts/publish_public_results.py --date "$TARGET_DATE" --max-official 14 --sleep 1.25
          fi
      - name: Commit verified bulletin JSON only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-results/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'NO_NEW_OFFICIAL_DATA_TO_PUBLISH'
            exit 0
          fi
          git commit -m 'data(results): append BOAT RACE officially matched public results'
          git pull --rebase origin main
          git push origin HEAD:main
